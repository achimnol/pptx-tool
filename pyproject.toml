[project]
name = "pptx-tool"
version = "0.1.0"
description = "A command-line tool to normalize fonts and themes in PowerPoint files"
authors = [{ name = "Joongi Kim", email = "me@daybreaker.info" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lxml>=5.3",
]

[project.scripts]
pptx-tool = "pptx_tool.__main__:main"

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "mypy>=1.18",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pptx_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["pptx_tool", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "RUF",    # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["pptx_tool"]

[tool.mypy]
python_version = "3.10"
files = ["pptx_tool", "tests"]
strict = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
